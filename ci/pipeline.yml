groups:
- name: (( concat "build-" meta.pipeline "-releases" ))
  jobs:
  # A job left out of every group is invisible in the UI once groups exist.
  - testflight-env
  - testflight
  - rc
  - shipit
- name: versioning
  jobs:
  - major
  - minor
  - patch
- name: upstream-blobs
  jobs:
  - (( grab meta.source ))
  - (( concat meta.source "-cf-plugin" ))

meta:
  name:     (( param "Please name your pipeline" ))
  release:  (( concat meta.name " Release" ))
  target:   (( param "Please identify the name of the target Concourse CI" ))
  pipeline: (( grab meta.name ))
  url:      (( param "What is the URL for the Concourse instance this pipeline is located on?" ))

  git:
    email:  (( param "Please provide the git email for automated commits" ))
    name:   (( param "Please provide the git name for automated commits" ))

  github:
    uri:          (( concat "git@github.com:" meta.github.owner "/" meta.github.repo ))
    owner:        (( param "Please specify the name of the user / organization that owns the Github repository" ))
    repo:         (( param "Please specify the name of the Github repository" ))
    branch:       develop
    access_token: (( param "Please generate a Personal Access Token and specify it here" ))
    release_notes:
      repo:       "ci-release-notes"
      branch:     "main"
      file:       (( concat meta.name "-release-notes.md" ))
      uri:        (( concat "git@github.com:"  meta.github.owner "/" meta.github.release_notes.repo ))
      edit:       (( concat "https://github.com/" meta.github.owner "/"  meta.github.release_notes.repo "/edit/"  meta.github.release_notes.branch "/" meta.github.release_notes.file ))

  aws:
    bucket:      (( concat meta.pipeline "-pipeline" ))
    region_name: us-east-1
    access:      (( param "Please set your AWS Access Key ID" ))
    secret:      (( param "Please set your AWS Secret Key ID" ))

jobs:
# Read-only probe. The director is only reachable from inside the test
# environment, so the facts needed to write manifests/<source>.yml have to
# be gathered from a worker rather than a workstation.
- name: testflight-env
  # Reports director configuration and deployment names. public: true
  # would make that readable without authentication.
  public: false
  serial: true
  plan:
  - get: git
  - task: testflight-env
    config:
      platform: linux
      image_resource:
        type: docker-image
        source:
          repository: registry.ops.scalecf.net/genesis-community/concourse
      inputs:
      - name: git
      run:
        path: ./git/ci/scripts/testflight-env
        args: []
      params:
        BOSH_ENVIRONMENT:     (( grab meta.bosh.url ))
        BOSH_CA_CERT:         (( grab meta.bosh.ca ))
        BOSH_CLIENT:          (( grab meta.bosh.username ))
        BOSH_CLIENT_SECRET:   (( grab meta.bosh.password ))

- name: testflight
  # Handles deployment credentials via MANIFEST_VARS and deploys to a
  # real director. Its logs must not be world-readable.
  public: false
  serial: true
  plan:
  - get: git
    trigger: true
  - task: testflight
    config:
      platform: linux
      image_resource:
        type: docker-image
        source:
          repository: registry.ops.scalecf.net/genesis-community/concourse
      inputs:
      - name: git
      run:
        path: ./git/ci/scripts/testflight
        args: []
      params:
        REPO_ROOT:            git
        BOSH_ENVIRONMENT:     (( grab meta.bosh.url ))
        BOSH_CA_CERT:         (( grab meta.bosh.ca ))
        BOSH_CLIENT:          (( grab meta.bosh.username ))
        BOSH_CLIENT_SECRET:   (( grab meta.bosh.password ))
        CREDHUB_URL:          (( grab meta.credhub.url ))
        CREDHUB_CA_CERT:      (( grab meta.credhub.ca ))
        CREDHUB_CLIENT:       (( grab meta.credhub.username ))
        CREDHUB_SECRET:       (( grab meta.credhub.password ))
        BOSH_DEPLOYMENT:      (( concat meta.source "-ci" ))
        TEST_ERRANDS:         ~
        AWS_ACCESS_KEY:       (( grab meta.aws.access ))
        AWS_SECRET_KEY:       (( grab meta.aws.secret ))
        MANIFEST_PATH:        (( concat "manifests/" meta.source ".yml" ))
        MANIFEST_VARS:        "--- {}"
        MANIFEST_OP_PATHS:    ""

- name: rc
  public: true
  serial: true
  plan:
  - in_parallel:
    - get: git
      trigger: true
      passed: [testflight]
    - get: version
      trigger: false
      params:
        pre: rc
  - task: release-notes
    config:
      platform: linux
      image_resource:
        type: docker-image
        source:
          repository: registry.ops.scalecf.net/genesis-community/concourse
      inputs:
      - name: git
      run:
        path: sh
        args:
        - -ce
        - |
          cd git
          if [ -f ci/release_notes.md ]; then
            echo "######   RELEASE NOTES   ###############"
            echo
            cat ci/release_notes.md
            echo
            echo "########################################"
            echo
          else
            echo "NO RELEASE NOTES HAVE BEEN WRITTEN"
            echo "You *might* want to do that before"
            echo "hitting (+) on that shipit job..."
            echo
          fi
  - put: version
    params:
      file: version/number

- name: shipit
  public: true
  serial: true
  plan:
  - in_parallel:
    - get: version
      passed: [rc]
      params:
        bump: final
    - get: git
      passed: [rc]
  - task: release
    config:
      platform: linux
      image_resource:
        type: docker-image
        source:
          repository: registry.ops.scalecf.net/genesis-community/concourse
      inputs:
      - name: version
      - name: git
      outputs:
      - name: gh
      - name: pushme
      - name: notifications
      run:
        path: ./git/ci/scripts/shipit
        args: []
      params:
        REPO_ROOT:    git
        VERSION_FROM: version/number
        RELEASE_ROOT: gh
        REPO_OUT:     pushme
        NOTIFICATION_OUT: notifications
        BRANCH:         main
        GITHUB_OWNER:   (( grab meta.github.owner ))
        GIT_EMAIL:      (( grab meta.git.email ))
        GIT_NAME:       (( grab meta.git.name ))
        AWS_ACCESS_KEY: (( grab meta.aws.access ))
        AWS_SECRET_KEY: (( grab meta.aws.secret ))

  - put: upload-git
    resource: git
    params:
      rebase: true
      repository: pushme
  - put: github-release
    resource: (( grab meta.name ))
    params:
      name:   gh/name
      tag:    gh/tag
      body:   gh/notes.md
      globs: [gh/artifacts/*]
  - put: version-bump-patch
    resource: version
    params:
      bump: patch

- name: patch
  public: true
  plan:
  - get: version
    params:
      bump: patch
  - put: version
    params:
      file: version/number

- name: minor
  public: true
  plan:
  - do:
    - get: version
      params:
        bump: minor
    - put: version
      params:
        file: version/number

- name: major
  public: true
  plan:
  - get: version
    params:
      bump: major
  - put: version
    params:
      file: version/number


- name: (( grab meta.source ))
  # Credentials are passed to make, so the log must not be world-readable.
  public: false
  plan:
  - in_parallel:
    - get: git
    - get: (( grab meta.source ))
      trigger: true
      params:
        # Every platform, not just linux/amd64: the release carries darwin
        # builds as uncompiled payload.
        globs: [ (( concat meta.source "-*.tar.gz" )) ]
  - task: (( concat "update-" meta.source ))
    config:
      platform: linux
      image_resource:
        type: docker-image
        source:
          repository: registry.ops.scalecf.net/genesis-community/concourse
      inputs:
      - name: git
      - name: (( grab meta.source ))
      run:
        # make runs from the repo root, which is where blobs.mk and
        # config/blobs.yml live.
        dir: git
        path: make
        args:
        - (( concat "blobs-" meta.source ))
        # The resource has already downloaded the assets and written a
        # version file beside them, so no ref, gh or curl is needed here.
        - (( concat "FROM=../" meta.source ))
      params:
        GIT_NAME:         (( grab meta.git.name ))
        GIT_EMAIL:        (( grab meta.git.email ))
        AWS_ACCESS_KEY:   (( grab meta.aws.access ))
        AWS_SECRET_KEY:   (( grab meta.aws.secret ))
  - put: git
    params:
      rebase: true
      repository: git

# The plugin has never had a bump job -- its blob has only ever been moved
# by hand, which is why it sat at 1.0.0 while upstream reached 1.2.0 and
# renamed its assets.
- name: (( concat meta.source "-cf-plugin" ))
  public: false
  plan:
  - in_parallel:
    - get: git
    - get: (( concat meta.source "-cf-plugin" ))
      trigger: true
      params:
        # Flat per-platform binaries, not tarballs, because
        # `cf install-plugin` needs each individually downloadable. The
        # .sha1 sidecars are deliberately excluded.
        globs:
        - (( concat meta.source "-cf-plugin-*+linux.amd64" ))
        - (( concat meta.source "-cf-plugin-*+linux.arm64" ))
        - (( concat meta.source "-cf-plugin-*+darwin.amd64" ))
        - (( concat meta.source "-cf-plugin-*+darwin.arm64" ))
        - (( concat meta.source "-cf-plugin-*+windows.amd64.exe" ))
  - task: (( concat "update-" meta.source "-cf-plugin" ))
    config:
      platform: linux
      image_resource:
        type: docker-image
        source:
          repository: registry.ops.scalecf.net/genesis-community/concourse
      inputs:
      - name: git
      - name: (( concat meta.source "-cf-plugin" ))
      run:
        dir: git
        path: make
        args:
        - (( concat "blobs-" meta.source "-cf-plugin" ))
        - (( concat "FROM=../" meta.source "-cf-plugin" ))
      params:
        GIT_NAME:         (( grab meta.git.name ))
        GIT_EMAIL:        (( grab meta.git.email ))
        AWS_ACCESS_KEY:   (( grab meta.aws.access ))
        AWS_SECRET_KEY:   (( grab meta.aws.secret ))
  - put: git
    params:
      rebase: true
      repository: git

resources:
- name: git
  type: git
  source:
    uri:         (( concat "https://github.com/" meta.github.owner "/" meta.github.repo ".git" ))
    branch:      (( grab meta.github.branch ))
    username:    (( grab meta.github.username ))
    password:    (( grab meta.github.access_token ))

- name: version
  type: semver
  source:
    driver:            s3
    bucket:            (( grab meta.aws.bucket ))
    region_name:       (( grab meta.aws.region_name ))
    key:               (( concat meta.github.source-repo "/boshrelease-version" ))
    access_key_id:     (( grab meta.aws.access ))
    secret_access_key: (( grab meta.aws.secret ))
    initial_version:   "1.2.0"

- name: (( grab meta.name ))
  type: github-release
  source:
    user:         (( grab meta.github.owner ))
    repository:   (( grab meta.github.repo ))
    access_token: (( grab meta.github.access_token ))

- name: (( grab meta.source ))
  type: github-release
  source:
    user:         (( grab meta.github.owner ))
    repository:   (( grab meta.github.source-repo ))
    access_token: (( grab meta.github.access_token ))
    # Upstream carries both tag schemes for the same commit: 'v2.0.1' and
    # 'v-2.0.1'. The default filter parses neither reliably once 'v-' is
    # in use, because 'v-2.0.1' is not semver.
    tag_filter:   'v-?([0-9].*)'

- name: (( concat meta.source "-cf-plugin" ))
  type: github-release
  source:
    user:         (( grab meta.github.owner ))
    repository:   (( concat meta.source "-cf-plugin" ))
    access_token: (( grab meta.github.access_token ))
    tag_filter:   'v-?([0-9].*)'
