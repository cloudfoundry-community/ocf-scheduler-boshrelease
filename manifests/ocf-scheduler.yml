---
# manifests/ocf-scheduler.yml
#
# Deployment manifest for ci/scripts/testflight. Restored from
# manifests/scheduler.yml, which existed for two days in May 2022
# (525a024, deleted by e1d80f1) and was never replaced -- the pipeline
# added in 2023 has looked for this filename ever since and never found
# it.
#
# testflight generates an ops file and overwrites several values here, so
# do not bother tuning them:
#
#   /name                             <- $BOSH_DEPLOYMENT
#   /releases/name=ocf-scheduler      <- the dev release it just built
#   /instance_groups/*/vm_type        <- a vm_type from the cloud-config
#   /instance_groups/*/networks       <- a network from the cloud-config
#   /instance_groups/*/persistent_disk_type
#                                     <- only for groups declaring one
#
# It does NOT inject `azs` or the stemcell, so both are declared here and
# have to match the target director.
#
# testflight only checks that the release deploys and starts; it runs no
# errands. The scheduler reads the CF API root at startup to find UAA, so
# cf.api has to be a real, reachable API: thunderdome's CF. The client
# credentials and the smoke-tests login are placeholders; nothing uses
# them until the scheduler serves a request or the errand runs.

name: ocf-scheduler

# The version is replaced with the dev release under test. The entry must
# exist for the ops file's `path: /releases/name=ocf-scheduler` to resolve.
releases:
- name: ocf-scheduler
  sha1: 168c8f37fe0f040d46c0cdc38c14324936e52fe2
  url: https://github.com/cloudfoundry-community/ocf-scheduler-boshrelease/releases/download/v2.0.0/ocf-scheduler-2.0.0.tgz
  version: 2.0.0
- name: postgres
  sha1: 84ca2cd0773d2bcb92872773a330a5c087d9eebb
  url: https://bosh.io/d/github.com/cloudfoundry/postgres-release?v=51
  version: "51"

# ubuntu-jammy is the only stemcell uploaded to thunderdome (verified
# 2026-07-29: bosh-vsphere-esxi-ubuntu-jammy-go_agent/1.1298, the sole
# entry). Revisit when noble is available there.
stemcells:
- alias: default
  os: ubuntu-jammy
  version: latest

update:
  canaries: 1
  max_in_flight: 1
  canary_watch_time: 5000-60000
  update_watch_time: 5000-60000

instance_groups:
- name: ocf-scheduler
  azs: [z1]
  instances: 1
  stemcell: default
  vm_type: default
  persistent_disk_type: default
  networks:
  - name: default
  jobs:
  - name: scheduler
    release: ocf-scheduler
    properties:
      scheduler:
        cf:
          api: https://api.system.cf.thunderdome.lab.scalecf.net
        uaa:
          endpoint: https://uaa.system.cf.thunderdome.lab.scalecf.net
          client_id: placeholder
          client_secret: placeholder
        postgres:
          uri: postgres://scheduler:scheduler@127.0.0.1:5432/scheduler?sslmode=disable

  # Colocated Postgres, as in the Genesis kit's default (no
  # external-postgres feature). Throwaway test data, so the credentials
  # are fixed rather than generated.
  - name: postgres
    release: postgres
    properties:
      databases:
        port: 5432
        roles:
        - name: scheduler
          password: scheduler
        databases:
        - name: scheduler

# lifecycle belongs on the instance group, which is where BOSH reads it.
- name: smoke-tests
  azs: [z1]
  lifecycle: errand
  instances: 1
  stemcell: default
  vm_type: default
  networks:
  - name: default
  jobs:
  - name: smoke-tests
    release: ocf-scheduler
    properties:
      cf:
        api: https://api.system.cf.thunderdome.lab.scalecf.net
        username: placeholder
        password: placeholder
        organization: placeholder
        space: placeholder
